services:
  bot:
    build: .
    pull_policy: build
    image: mattermost-knowledge-bot:latest
    container_name: kb-bot
    restart: unless-stopped
    networks:
      - pm-network
    env_file: ./.env
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "3333:3333"
    volumes:
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/kb-bot.db || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: kb-ollama
    restart: unless-stopped
    networks:
      - pm-network
    volumes:
      - ollama_data:/root/.ollama
    # The ollama image has no curl/wget; use the bundled `ollama` binary
    # itself — `ollama list` is a cheap call against the local API.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama_data:

networks:
  pm-network:
    external: true
    name: pm-network
